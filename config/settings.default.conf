# sketchetc global settings · edit here or from the 󰀵 menu → Settings
# Notifications (per category)
notify_shot=on
notify_aura=on
notify_journal=on
notify_ram=on
notify_speedtest=on
notify_pomodoro=on
notify_toggles=on
notify_ports=on
notify_clipboard=on
notify_shelf=on
# Sound + voice
sound=on
voice=on
# Drop files anywhere on the bar to shelve them
bar_drop=on

# Motion
animations=on

# Clipboard history depth
clip_max=20

# Screenshots
shot_to_clipboard=on
shot_dir=DESKTOP
channel=production
notify_update=on
data_dir=

# Mirrored menu bar icons (Docker, Cursor, ...)
extras_collapsed=off
extras_deny=
