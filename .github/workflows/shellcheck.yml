name: shellcheck
on:
  pull_request:
  push:
    branches: [develop, production]
  workflow_dispatch:

permissions: read-all

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static analysis of every shell script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # style-only findings stay advisory; real bugs fail the build
          shellcheck -S error -x $(git ls-files '*.sh') config/sketchybarrc
          echo "no shellcheck errors"
      - name: Advisory report
        continue-on-error: true
        run: shellcheck -S style -x $(git ls-files '*.sh') || true
