name: sign release

# Attaches the installer, its checksum and a source tarball to every tag, each
# signed with keyless cosign so anyone can verify a download came from this
# repo's release workflow and not from someone reposting the one-liner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to sign (defaults to the pushed ref)"
        required: false
        type: string

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uploads assets to the release
      id-token: write   # keyless signing via OIDC
      attestations: write   # build provenance for the artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve the tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build the artifacts
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/install.sh dist/install.sh
          git archive --format=tar.gz --prefix="sketchetc-${TAG}/" -o "dist/sketchetc-${TAG}.tar.gz" HEAD
          cd dist
          shasum -a 256 install.sh "sketchetc-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign every artifact
        run: |
          set -euo pipefail
          cd dist
          # cosign v4 only writes sigstore bundles; the deprecated detached
          # flags are refused outright. The .sig/.pem pair is unpacked from the
          # bundle afterwards, so older verifiers still have something to use.
          for f in install.sh SHA256SUMS sketchetc-*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            jq -r '.messageSignature.signature' "$f.sigstore.json" > "$f.sig"
            {
              echo "-----BEGIN CERTIFICATE-----"
              jq -r '.verificationMaterial.certificate.rawBytes' "$f.sigstore.json" | fold -w 64
              echo "-----END CERTIFICATE-----"
            } > "$f.pem"
            openssl x509 -in "$f.pem" -noout -subject >/dev/null   # fail loudly on a malformed cert
          done
          ls -l

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/install.sh, dist/sketchetc-*.tar.gz

      - name: Attach the provenance bundle as an asset
        # the attestation is queryable via the API, but auditors look for the
        # in-toto bundle sitting on the release itself
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          # the tag push can beat `gh release create` in scripts/release.sh, so
          # wait for the release rather than failing the run
          for _ in $(seq 1 20); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
